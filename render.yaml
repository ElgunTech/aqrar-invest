services:
  - type: web
    name: aqrar-invest-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/public/meta
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
