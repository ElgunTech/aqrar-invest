# Every push and pull request: backend tests (JUnit, H2) and the frontend type check and build.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests
        working-directory: backend
        run: mvn -B -q test
      - name: Test report
        if: always()
        run: |
          echo "| Test class | Tests | Failures | Errors |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in backend/target/surefire-reports/TEST-*.xml; do
            n=$(grep -o 'testsuite [^>]*' "$f" | head -1)
            name=$(echo "$n" | grep -o 'name="[^"]*"' | head -1 | cut -d'"' -f2)
            t=$(echo "$n" | grep -o ' tests="[0-9]*"' | cut -d'"' -f2)
            fl=$(echo "$n" | grep -o 'failures="[0-9]*"' | cut -d'"' -f2)
            er=$(echo "$n" | grep -o 'errors="[0-9]*"' | cut -d'"' -f2)
            echo "| $name | $t | $fl | $er |" >> $GITHUB_STEP_SUMMARY
          done
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
        env:
          VERCEL: "1"
