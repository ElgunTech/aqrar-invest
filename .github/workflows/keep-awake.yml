# Render free instances sleep after 15 min without traffic; ping the API every 10 min.
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 --retry 3 https://aqrar-invest-api.onrender.com/api/v1/public/meta -o /dev/null && echo awake
