spring.application.name=agro-investment-portal
server.port=8080
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=60m
server.error.include-message=always

# --- Database (H2 file DB for the demo; see application-postgres.properties) ---
spring.datasource.url=jdbc:h2:file:./data/agro-portal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Uploads ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# --- OpenAPI / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# --- Portal settings ---
app.upload-dir=./uploads
app.model-dir=./model
app.seed-demo-data=true

# --- EKTIS integration (mock EKTIS runs inside this app under /mock-ektis) ---
# For real integration change base-url and keys; nothing else in the code changes.
app.ektis.base-url=http://localhost:${server.port}/mock-ektis/api/v1
app.ektis.api-key=${EKTIS_API_KEY:demo-ektis-outbound-key}
app.ektis.outbox-interval-ms=4000
app.ektis.max-attempts=5
# Key EKTIS must send when calling our webhook /api/v1/integration/ektis/**
app.integration.inbound-api-key=${INTEGRATION_API_KEY:demo-ektis-inbound-key}
# Where the mock EKTIS sends its callbacks
app.mock-ektis.callback-url=http://localhost:${server.port}/api/v1/integration/ektis/events
app.mock-ektis.callback-delay-ms=3000

# --- myGov login (OAuth 2.0 authorization code). Demo uses the built-in simulator. ---
app.mygov.authorize-url=/mygov-demo
app.mygov.api-base-url=http://localhost:${server.port}/mock-mygov/api
app.mygov.client-id=aqrar-invest-portal
app.mygov.client-secret=${MYGOV_CLIENT_SECRET:demo-mygov-client-secret}
app.mygov.redirect-uri=/mygov/callback

# --- Assistant: optional free LLM (OpenAI-compatible API, e.g. Groq free tier). Empty key = built-in answers. ---
app.assistant.llm.api-key=${GROQ_API_KEY:}
app.assistant.llm.base-url=https://api.groq.com/openai/v1
app.assistant.llm.model=llama-3.1-8b-instant

# E-mail copies of portal notifications (Brevo SMTP; any SMTP works). Without SMTP_PASSWORD only in-portal notifications.
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${MAIL_FROM:}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.public-url=${PUBLIC_URL:https://frontend-black-seven-54.vercel.app}
